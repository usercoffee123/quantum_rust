[package]
name = "qiskit-rust"
version = "0.1.0"
edition = "2024"
description = "A small state-vector simulator with configurable CPU threads and Qiskit comparisons"
license = "Apache-2.0"

[dependencies]
half = "2.7"
num-complex = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "statevector"
path = "src/bin/statevector.rs"
